[package]
name = "ndd-sql"
version = "2.0.0"
description = "Monitoramento RPA"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
# ADICIONE ESTA LINHA AQUI:
tauri = { version = "1", features = ["shell-open", "updater", "dialog"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# Adicionamos o "sqlite" na lista de features!
sqlx = { version = "=0.6.3", features = ["runtime-tokio-rustls", "mssql", "sqlite", "chrono", "macros", "offline"] }

[features]
# Esta seção exige que a dependência 'tauri' exista acima
custom-protocol = ["tauri/custom-protocol"]
