[package]
name = "ndd-sql"
version = "3.0.1"
description = "Monitoramento RPA"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "system-tray", "notification-all", "shell-open", "updater", "dialog", "icon-ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
sqlx = { version = "=0.6.3", features = ["runtime-tokio-rustls", "mssql", "sqlite", "chrono", "macros", "offline"] }

[features]
# Esta seção exige que a dependência 'tauri' exista acima
custom-protocol = ["tauri/custom-protocol"]
